# Raz w miesiacu (i na zadanie: Actions -> "Aktualizuj baze luk" -> Run workflow)
# pobiera CISA KEV, NVD i EPSS, buduje katalog luki/ (i stary luki.txt) i zapisuje go w repozytorium,
# jesli sie zmienil. Urzadzenia Radar Sieci pobieraja potem nowa wersje same.
name: Aktualizuj baze luk

on:
  schedule:
    - cron: "17 3 2 * *"        # 2. dzien miesiaca, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  luki:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zbuduj baze luk (CISA KEV + NVD + EPSS)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # opcjonalny - przyspiesza pobieranie
        run: python skrypty/buduj_luki.py .

      - name: Zapisz zmiany
        run: |
          git add -A luki.txt luki
          if git diff --cached --quiet; then
            echo "Baza bez zmian."
            exit 0
          fi
          git config user.name "radar-sieci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualizacja bazy luk $(date -u +%Y-%m-%d)"
          git push
