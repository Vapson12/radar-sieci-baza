# Raz w miesiacu (i na zadanie: Actions -> "Aktualizuj baze luk" -> Run workflow)
# pobiera CISA KEV i NVD, buduje luki.txt i zapisuje go w repozytorium,
# jesli sie zmienil. Urzadzenia Radar Sieci pobieraja potem nowa wersje same.
name: Aktualizuj baze luk

on:
  schedule:
    - cron: "17 3 2 * *"        # 2. dzien miesiaca, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  luki:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zbuduj luki.txt (CISA KEV + NVD)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # opcjonalny - przyspiesza pobieranie
        run: python skrypty/buduj_luki.py luki.txt

      - name: Zapisz zmiany
        run: |
          if git diff --quiet -- luki.txt && git ls-files --error-unmatch luki.txt >/dev/null 2>&1; then
            echo "Baza bez zmian."
            exit 0
          fi
          git config user.name "radar-sieci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luki.txt
          git commit -m "Aktualizacja bazy luk $(date -u +%Y-%m-%d)"
          git push
